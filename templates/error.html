{% extends 'base.html' %}

{% block title %}{{ error_code }} Error - QuizMaster{% endblock %}

{% block content %}
<div class="container my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-4 p-5">
                <div class="d-inline-flex p-4 rounded-circle bg-danger-subtle text-danger mb-4 mx-auto">
                    <i class="bi bi-exclamation-triangle-fill display-1"></i>
                </div>
                <h1 class="display-3 fw-extrabold text-dark mb-2">{{ error_code }}</h1>
                <h4 class="fw-bold mb-3">{{ error_message }}</h4>
                <p class="text-muted mb-4">We couldn't find or process what you were looking for. Please navigate back to the dashboard or home page.</p>
                <div>
                    <a href="{{ url_for('quiz.index') }}" class="btn btn-primary-gradient rounded-pill px-4 me-2">
                        <i class="bi bi-house-door me-1"></i> Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
