{% extends 'base.html' %}

{% block title %}Create Account - QuizMaster{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-3">
                        <i class="bi bi-person-plus-fill fs-1"></i>
                    </div>
                    <h2 class="fw-bold mb-1">Create Account</h2>
                    <p class="text-muted small">Join thousands of learners and take interactive quizzes</p>
                </div>

                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" name="full_name" class="form-control bg-light border-start-0" placeholder="e.g. John Doe" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control bg-light border-start-0" placeholder="john@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control bg-light border-start-0" placeholder="At least 6 characters" minlength="6" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-check2-circle"></i></span>
                            <input type="password" name="confirm_password" class="form-control bg-light border-start-0" placeholder="Re-enter password" minlength="6" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-3 rounded-3 fw-semibold shadow-sm">
                        Register Account <i class="bi bi-person-check-fill ms-1"></i>
                    </button>
                </form>

                <div class="text-center mt-4 border-top pt-3">
                    <p class="text-muted small mb-0">Already have an account? <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary text-decoration-none">Log in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
