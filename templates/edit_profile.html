{% extends 'base.html' %}

{% block title %}Edit Profile - QuizMaster{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                    <div class="bg-primary text-white rounded-circle fs-3 fw-bold d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                        {{ user.full_name[0] }}
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0">Edit Profile</h3>
                        <p class="text-muted small mb-0">Update your account personal details</p>
                    </div>
                </div>

                <form action="{{ url_for('user.edit_profile') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="full_name" class="form-control bg-light" value="{{ user.full_name }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control bg-light" value="{{ user.email }}" required>
                    </div>

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary-gradient px-4 rounded-pill">Save Changes</button>
                        <a href="{{ url_for('user.dashboard') }}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
