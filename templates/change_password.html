{% extends 'base.html' %}

{% block title %}Change Password - QuizMaster{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                    <div class="bg-warning text-dark rounded-circle fs-3 fw-bold d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                        <i class="bi bi-key-fill"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0">Change Password</h3>
                        <p class="text-muted small mb-0">Ensure your account uses a strong password</p>
                    </div>
                </div>

                <form action="{{ url_for('user.change_password') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Current Password</label>
                        <input type="password" name="current_password" class="form-control bg-light" placeholder="Enter current password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" name="new_password" class="form-control bg-light" placeholder="At least 6 characters" minlength="6" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control bg-light" placeholder="Re-enter new password" minlength="6" required>
                    </div>

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-warning fw-bold px-4 rounded-pill">Update Password</button>
                        <a href="{{ url_for('user.dashboard') }}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
